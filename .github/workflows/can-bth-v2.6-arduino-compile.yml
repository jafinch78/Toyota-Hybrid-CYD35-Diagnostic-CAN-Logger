name: CAN BTH v2.6 Arduino Compile

on:
  push:
    branches:
      - feature/can-bth-logger-v2.6
  workflow_dispatch:

jobs:
  compile-can-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned ESP32 core and TFT_eSPI
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "TFT_eSPI@2.5.43"
          arduino-cli version
          arduino-cli core list
          arduino-cli lib list | grep -E '^TFT_eSPI'

      - name: Stage immutable RC2 source fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci_rc2/firmware
          cp -a firmware/Toyota_Hybrid_CYD35_Diagnostic_CAN_Logger_v2_5_0 .ci_rc2/firmware/
          test "$(git hash-object .ci_rc2/firmware/Toyota_Hybrid_CYD35_Diagnostic_CAN_Logger_v2_5_0/Toyota_Hybrid_CYD35_Diagnostic_CAN_Logger_v2_5_0.ino)" = "bbc7421da2bfc684324123b3232895cdcfd6c23d"

      - name: Generate default CAN-only acquisition build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci_generated
          python tools/build_can_bth_v2_6_0_firmware_r2.py .ci_rc2/firmware/Toyota_Hybrid_CYD35_Diagnostic_CAN_Logger_v2_5_0 .ci_generated
          SKETCH=.ci_generated/Toyota_Hybrid_CYD35_CAN_BTH_Logger_v2_6_0
          grep -q '#define ENABLE_BTH_CAPTURE 0' "$SKETCH/Toyota_Hybrid_CYD35_CAN_BTH_Logger_v2_6_0.ino"
          grep -q 'CAN_QUEUE_LENGTH = 768' "$SKETCH/Toyota_Hybrid_CYD35_CAN_BTH_Logger_v2_6_0.ino"
          grep -q 'CAN_BATCH_LENGTH = 128' "$SKETCH/Toyota_Hybrid_CYD35_CAN_BTH_Logger_v2_6_0.ino"
          cp "$SKETCH/TFT_eSPI_User_Setup_CYD35.h" "$HOME/Arduino/libraries/TFT_eSPI/User_Setup.h"

      - name: Compile default Dorhea CAN-only build
        shell: bash
        run: |
          set -euo pipefail
          SKETCH=.ci_generated/Toyota_Hybrid_CYD35_CAN_BTH_Logger_v2_6_0
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --warnings all \
            "$SKETCH"
