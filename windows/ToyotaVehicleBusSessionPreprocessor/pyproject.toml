[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toyota-vehicle-bus-session-preprocessor"
version = "0.1.0"
description = "Validate and expand Toyota vehicle-bus native capture sessions"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
toyota-session-preprocess = "toyota_vehicle_bus_session.cli:main"
toyota-session-preprocess-gui = "toyota_vehicle_bus_session.gui:main"

[tool.setuptools.packages.find]
include = ["toyota_vehicle_bus_session*"]
