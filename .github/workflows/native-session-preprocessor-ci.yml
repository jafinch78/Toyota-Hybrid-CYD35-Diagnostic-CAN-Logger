name: Native Session Preprocessor CI

on:
  push:
    branches:
      - feature/native-session-preprocessor-impl
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/ToyotaVehicleBusSessionPreprocessor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python version
        run: python --version
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: CLI help smoke
        shell: pwsh
        run: |
          python -m pip install --force-reinstall (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          toyota-session-preprocess --help
      - name: Upload tested preprocessor artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-session-preprocessor-tested
          path: |
            windows/ToyotaVehicleBusSessionPreprocessor/dist/*.whl
            windows/ToyotaVehicleBusSessionPreprocessor/scripts/validate_real_sessions.py
          if-no-files-found: error
      - name: Checkout exact Evidence Builder 1.0.4 oracle
        uses: actions/checkout@v4
        with:
          ref: evidence-builder-v1.0.4
          path: _builder_oracle
      - name: Upload Evidence Builder 1.0.4 oracle source
        uses: actions/upload-artifact@v4
        with:
          name: evidence-builder-v1.0.4-source
          path: _builder_oracle/windows/ToyotaCANEvidenceBuilder/**
          if-no-files-found: error
